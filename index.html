<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>vocal tuner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --burgundy: #4A0E1E;
    --burgundy-dark: #2C0712;
    --gold: #C9A24B;
    --gold-soft: rgba(201, 162, 75, 0.35);
    --ivory: #F3E9D2;
    --ivory-dim: rgba(243, 233, 210, 0.45);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: radial-gradient(circle at 50% 30%, var(--burgundy) 0%, var(--burgundy-dark) 100%);
    color: var(--ivory);
    font-family: 'Playfair Display', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ---------- start screen ---------- */
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }

  #start.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #start .label {
    font-size: 2rem;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.04em;
    color: var(--ivory);
    opacity: 0.85;
    animation: breathe 3.2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.95; }
  }

  #start .err {
    position: absolute;
    bottom: 12%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.95rem;
    font-style: italic;
    color: var(--gold);
    padding: 0 2rem;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #start .err.show { opacity: 0.9; }

  /* ---------- tuner ---------- */
  #tuner {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(6vh, 2rem) 1.5rem max(5vh, 1.5rem);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease 0.2s;
  }

  #tuner.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* note display */
  .note-zone {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 4vh;
  }

  #note {
    font-size: clamp(5rem, 32vw, 11rem);
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    justify-content: center;
    transition: color 0.18s ease, text-shadow 0.18s ease;
    color: var(--ivory);
  }

  #note .octave {
    font-size: 0.34em;
    font-style: italic;
    opacity: 0.6;
    margin-left: 0.12em;
    font-weight: 400;
  }

  #note.resting {
    color: var(--ivory-dim);
  }

  #note.locked {
    color: var(--gold);
    text-shadow: 0 0 28px var(--gold-soft), 0 0 8px rgba(201,162,75,0.5);
  }

  #freq {
    margin-top: 0.6rem;
    font-size: 0.95rem;
    font-style: italic;
    letter-spacing: 0.05em;
    color: var(--ivory-dim);
    min-height: 1.2em;
  }

  /* tuning indicator */
  .indicator-zone {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
  }

  .meter {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 88px;
  }

  .meter .track {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    transform: translateY(-50%);
    background: linear-gradient(to right,
      rgba(243,233,210,0) 0%,
      rgba(243,233,210,0.25) 15%,
      rgba(243,233,210,0.25) 85%,
      rgba(243,233,210,0) 100%);
  }

  .meter .centre {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 40px;
    transform: translate(-50%, -50%);
    background: var(--gold);
    opacity: 0.7;
    border-radius: 2px;
  }

  .meter .needle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 60px;
    border-radius: 4px;
    background: var(--ivory);
    transform: translate(-50%, -50%);
    transition: transform 0.09s linear, background 0.18s ease, box-shadow 0.18s ease, opacity 0.3s ease;
    will-change: transform;
  }

  .meter .needle.resting {
    opacity: 0.2;
  }

  .meter .needle.locked {
    background: var(--gold);
    box-shadow: 0 0 20px var(--gold-soft), 0 0 6px rgba(201,162,75,0.6);
  }

  #cents {
    font-size: 1.05rem;
    font-style: italic;
    letter-spacing: 0.06em;
    color: var(--ivory-dim);
    min-height: 1.3em;
    transition: color 0.18s ease;
  }

  #cents.locked { color: var(--gold); }

  /* pitch pipe */
  .pipe-zone {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .pipe-label {
    font-size: 0.8rem;
    font-style: italic;
    letter-spacing: 0.12em;
    color: var(--ivory-dim);
  }

  .pipe {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.5rem;
    width: 100%;
    max-width: 420px;
  }

  .key {
    appearance: none;
    border: 1px solid rgba(201,162,75,0.4);
    background: rgba(201,162,75,0.06);
    color: var(--ivory);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 500;
    padding: 0.85rem 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease, transform 0.08s ease, border-color 0.12s ease;
  }

  .key .sharp {
    font-size: 0.7em;
    vertical-align: super;
    opacity: 0.75;
  }

  .key.sounding {
    background: var(--gold);
    color: var(--burgundy-dark);
    border-color: var(--gold);
    box-shadow: 0 0 22px var(--gold-soft);
    transform: translateY(1px);
  }

  @media (hover: hover) {
    .key:hover { border-color: rgba(201,162,75,0.75); }
  }
</style>
</head>
<body>

  <div id="start">
    <div class="label">tap to begin</div>
    <div class="err" id="start-err"></div>
  </div>

  <div id="tuner">
    <div class="note-zone">
      <div id="note" class="resting">&ndash;</div>
      <div id="freq"></div>
    </div>

    <div class="indicator-zone">
      <div class="meter">
        <div class="track"></div>
        <div class="centre"></div>
        <div class="needle resting" id="needle"></div>
      </div>
      <div id="cents"></div>
    </div>

    <div class="pipe-zone">
      <div class="pipe-label">pitch pipe</div>
      <div class="pipe" id="pipe"></div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var A4 = 440;
  var MIN_FREQ = 70;
  var MAX_FREQ = 1200;
  var RMS_GATE = 0.01;
  var CLARITY_GATE = 0.9;        // normalized autocorrelation peak threshold
  var SMOOTH_MS = 400;           // vibrato smoothing window
  var LOCK_CENTS = 5;

  // ---------- elements ----------
  var startEl = document.getElementById('start');
  var startErr = document.getElementById('start-err');
  var tunerEl = document.getElementById('tuner');
  var noteEl = document.getElementById('note');
  var freqEl = document.getElementById('freq');
  var needleEl = document.getElementById('needle');
  var centsEl = document.getElementById('cents');
  var pipeEl = document.getElementById('pipe');

  // ---------- audio state ----------
  var audioCtx = null;
  var analyser = null;
  var micStream = null;
  var timeBuf = null;
  var sampleRate = 44100;
  var rafId = null;

  // active reference oscillators keyed by midi number
  var activeTones = {};
  var soundingCount = 0;

  // rolling frequency buffer for vibrato smoothing: {t, f}
  var freqHistory = [];

  // ---------- note maths ----------
  function freqToMidi(f) {
    return 69 + 12 * Math.log2(f / A4);
  }
  function midiToFreq(m) {
    return A4 * Math.pow(2, (m - 69) / 12);
  }
  function midiToName(m) {
    var idx = ((Math.round(m) % 12) + 12) % 12;
    return NOTE_NAMES[idx];
  }
  function midiToOctave(m) {
    return Math.floor(Math.round(m) / 12) - 1;
  }

  // ---------- pitch detection: normalized autocorrelation ----------
  function detectPitch(buf, rate) {
    var size = buf.length;
    var i, j;

    // RMS gate
    var rms = 0;
    for (i = 0; i < size; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / size);
    if (rms < RMS_GATE) return null;

    // search lag range corresponding to MIN_FREQ..MAX_FREQ
    var minLag = Math.floor(rate / MAX_FREQ);
    var maxLag = Math.ceil(rate / MIN_FREQ);
    if (maxLag >= size) maxLag = size - 1;

    var bestLag = -1;
    var bestCorr = 0;

    // normalized autocorrelation
    for (var lag = minLag; lag <= maxLag; lag++) {
      var corr = 0;
      var norm0 = 0;
      var norm1 = 0;
      for (i = 0, j = lag; j < size; i++, j++) {
        corr += buf[i] * buf[j];
        norm0 += buf[i] * buf[i];
        norm1 += buf[j] * buf[j];
      }
      var denom = Math.sqrt(norm0 * norm1);
      var nc = denom > 0 ? corr / denom : 0;
      if (nc > bestCorr) {
        bestCorr = nc;
        bestLag = lag;
      }
    }

    if (bestLag < 0 || bestCorr < CLARITY_GATE) return null;

    // parabolic interpolation around the peak for sub-sample accuracy
    var refinedLag = bestLag;
    if (bestLag > minLag && bestLag < maxLag) {
      var c0 = ncAt(buf, bestLag - 1, size);
      var c1 = bestCorr;
      var c2 = ncAt(buf, bestLag + 1, size);
      var denom2 = (c0 - 2 * c1 + c2);
      if (denom2 !== 0) {
        var shift = 0.5 * (c0 - c2) / denom2;
        if (shift > -1 && shift < 1) refinedLag = bestLag + shift;
      }
    }

    var freq = rate / refinedLag;
    if (freq < MIN_FREQ || freq > MAX_FREQ) return null;
    return freq;
  }

  function ncAt(buf, lag, size) {
    var corr = 0, norm0 = 0, norm1 = 0;
    for (var i = 0, j = lag; j < size; i++, j++) {
      corr += buf[i] * buf[j];
      norm0 += buf[i] * buf[i];
      norm1 += buf[j] * buf[j];
    }
    var denom = Math.sqrt(norm0 * norm1);
    return denom > 0 ? corr / denom : 0;
  }

  // ---------- vibrato smoothing (median over window) ----------
  function pushFreq(f, now) {
    freqHistory.push({ t: now, f: f });
    var cutoff = now - SMOOTH_MS;
    while (freqHistory.length && freqHistory[0].t < cutoff) {
      freqHistory.shift();
    }
  }

  function smoothedFreq() {
    if (!freqHistory.length) return null;
    var arr = freqHistory.map(function (e) { return e.f; }).sort(function (a, b) { return a - b; });
    var mid = Math.floor(arr.length / 2);
    return arr.length % 2 ? arr[mid] : (arr[mid - 1] + arr[mid]) / 2;
  }

  // ---------- display ----------
  function showResting() {
    freqHistory.length = 0;
    noteEl.className = 'resting';
    noteEl.innerHTML = '&ndash;';
    freqEl.textContent = '';
    centsEl.textContent = '';
    centsEl.className = '';
    needleEl.className = 'needle resting';
    needleEl.style.transform = 'translate(-50%, -50%) rotate(0deg)';
  }

  function render(freq) {
    var midi = freqToMidi(freq);
    var nearest = Math.round(midi);
    var nearestFreq = midiToFreq(nearest);
    var cents = 1200 * Math.log2(freq / nearestFreq);

    var name = midiToName(nearest);
    var octave = midiToOctave(nearest);
    var sharp = name.length > 1;
    var letter = name.charAt(0);

    noteEl.innerHTML = letter +
      (sharp ? '<span class="sharp" style="font-size:0.5em;vertical-align:super;">#</span>' : '') +
      '<span class="octave">' + octave + '</span>';

    freqEl.textContent = freq.toFixed(1) + ' hz';

    var rounded = Math.round(cents);
    var sign = rounded > 0 ? '+' : '';
    centsEl.textContent = sign + rounded + ' cents';

    // needle: map +/-50 cents to a rotation, with translation feel
    var clamped = Math.max(-50, Math.min(50, cents));
    var angle = (clamped / 50) * 38; // degrees
    needleEl.style.transform = 'translate(-50%, -50%) rotate(' + angle + 'deg)';

    var locked = Math.abs(cents) <= LOCK_CENTS;
    if (locked) {
      noteEl.className = 'locked';
      needleEl.className = 'needle locked';
      centsEl.className = 'locked';
    } else {
      noteEl.className = '';
      needleEl.className = 'needle';
      centsEl.className = '';
    }
  }

  // ---------- main loop ----------
  function tick() {
    rafId = requestAnimationFrame(tick);

    // pause live detection while a reference tone sounds
    if (soundingCount > 0) {
      return;
    }

    analyser.getFloatTimeDomainData(timeBuf);
    var now = performance.now();
    var freq = detectPitch(timeBuf, sampleRate);

    if (freq) {
      pushFreq(freq, now);
    } else {
      // let history decay; if window empties, rest
      var cutoff = now - SMOOTH_MS;
      while (freqHistory.length && freqHistory[0].t < cutoff) {
        freqHistory.shift();
      }
    }

    var sf = smoothedFreq();
    if (sf) {
      render(sf);
    } else {
      showResting();
    }
  }

  // ---------- pitch pipe ----------
  function startTone(midi, keyEl) {
    if (activeTones[midi]) return;
    if (!audioCtx) return;

    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = midiToFreq(midi);

    var t = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02); // ~20ms attack

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();

    activeTones[midi] = { osc: osc, gain: gain, keyEl: keyEl };
    soundingCount++;
    if (keyEl) keyEl.classList.add('sounding');

    // reset detection so it does not carry the tone over
    freqHistory.length = 0;
  }

  function stopTone(midi) {
    var node = activeTones[midi];
    if (!node) return;
    delete activeTones[midi];

    var t = audioCtx.currentTime;
    try {
      node.gain.gain.cancelScheduledValues(t);
      node.gain.gain.setValueAtTime(node.gain.gain.value, t);
      node.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); // ~80ms release
      node.osc.stop(t + 0.1);
    } catch (e) { /* ignore */ }

    if (node.keyEl) node.keyEl.classList.remove('sounding');

    soundingCount = Math.max(0, soundingCount - 1);
    if (soundingCount === 0) {
      // resume detection cleanly on next frames
      freqHistory.length = 0;
    }
  }

  function buildPipe() {
    // C4 (midi 60) to B4 (midi 71)
    for (var m = 60; m <= 71; m++) {
      var name = midiToName(m);
      var sharp = name.length > 1;
      var btn = document.createElement('button');
      btn.className = 'key';
      btn.type = 'button';
      btn.innerHTML = name.charAt(0) + (sharp ? '<span class="sharp">#</span>' : '');
      bindKey(btn, m);
      pipeEl.appendChild(btn);
    }
  }

  function bindKey(btn, midi) {
    var down = function (e) {
      e.preventDefault();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      startTone(midi, btn);
    };
    var up = function (e) {
      if (e) e.preventDefault();
      stopTone(midi);
    };

    // pointer events cover mouse + touch + pen with capture for press-and-hold
    btn.addEventListener('pointerdown', function (e) {
      down(e);
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    });
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', function (e) {
      // only stop on leave if pointer not captured (mouse drag-out)
      up(e);
    });
    // guard against stuck tones
    btn.addEventListener('lostpointercapture', up);
  }

  // ---------- start ----------
  function showError(msg) {
    startErr.textContent = msg;
    startErr.classList.add('show');
  }

  function start() {
    startEl.removeEventListener('click', start);

    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) {
      showError('audio is not supported on this browser');
      startEl.addEventListener('click', start);
      return;
    }
    audioCtx = new AudioCtx();
    sampleRate = audioCtx.sampleRate;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('microphone is not available here');
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    }).then(function (stream) {
      micStream = stream;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      timeBuf = new Float32Array(analyser.fftSize);
      source.connect(analyser);

      buildPipe();

      startEl.classList.add('hidden');
      tunerEl.classList.add('visible');
      showResting();

      tick();
    }).catch(function (err) {
      showError('microphone access is needed - tap to try again');
      startEl.addEventListener('click', start);
    });
  }

  startEl.addEventListener('click', start);
})();
</script>
</body>
</html>
